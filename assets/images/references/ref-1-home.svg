<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="ref-home-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Browser Window Frame -->
  <rect x="0" y="0" width="800" height="500" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  
  <!-- Browser Header Bar -->
  <rect x="0" y="0" width="800" height="40" rx="10" fill="#e2e8f0"/>
  <circle cx="25" cy="20" r="6" fill="#ef4444"/>
  <circle cx="45" cy="20" r="6" fill="#f59e0b"/>
  <circle cx="65" cy="20" r="6" fill="#10b981"/>
  <rect x="150" y="8" width="500" height="24" rx="12" fill="#ffffff"/>
  <text x="400" y="24" font-family="'Vazirmatn', Tahoma, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">https://taaghche.com (مرجع ۱: صفحه اصلی)</text>

  <!-- Taaghche Navbar -->
  <rect x="20" y="55" width="760" height="55" rx="8" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="710" y="68" width="50" height="28" rx="6" fill="#00aa88"/>
  <text x="735" y="86" font-family="'Vazirmatn', Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">طاقچه</text>
  <rect x="340" y="68" width="340" height="30" rx="15" fill="#f1f5f9"/>
  <text x="640" y="87" font-family="'Vazirmatn', Tahoma, sans-serif" font-size="11" fill="#94a3b8" text-anchor="end">جستجو در کتاب‌ها...</text>
  <rect x="40" y="68" width="100" height="30" rx="15" fill="#00aa88" fill-opacity="0.1"/>
  <text x="90" y="87" font-family="'Vazirmatn', Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#00aa88" text-anchor="middle">ورود / حساب</text>

  <!-- Hero Banner Carousel -->
  <rect x="20" y="125" width="760" height="150" rx="12" fill="url(#ref-home-bg)" filter="url(#shadow)"/>
  <text x="730" y="180" font-family="'Vazirmatn', Tahoma, sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="end">جشنواره شاهکارهای ادبیات و کتاب‌های برتر</text>
  <text x="730" y="215" font-family="'Vazirmatn', Tahoma, sans-serif" font-size="13" fill="#ccfbf1" text-anchor="end">دسته‌بندی‌های موضوعی، محبوب‌ترین رمان‌ها و کتاب‌های رایگان</text>
  <rect x="580" y="235" width="150" height="28" rx="14" fill="#ffffff"/>
  <text x="655" y="253" font-family="'Vazirmatn', Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#0f766e" text-anchor="middle">مشاهده پیشنهادها ←</text>

  <!-- Categories Pill Bar -->
  <g transform="translate(20, 290)">
    <rect x="630" y="0" width="130" height="32" rx="16" fill="#00aa88"/>
    <text x="695" y="20" font-family="'Vazirmatn', Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">همه موضوعات</text>
    <rect x="470" y="0" width="140" height="32" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="540" y="20" font-family="'Vazirmatn', Tahoma, sans-serif" font-size="11" fill="#475569" text-anchor="middle">شعر و ادبیات کهن</text>
    <rect x="310" y="0" width="140" height="32" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="380" y="20" font-family="'Vazirmatn', Tahoma, sans-serif" font-size="11" fill="#475569" text-anchor="middle">داستان و رمان ایرانی</text>
    <rect x="170" y="0" width="120" height="32" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="230" y="20" font-family="'Vazirmatn', Tahoma, sans-serif" font-size="11" fill="#475569" text-anchor="middle">طنز و جامعه</text>
    <rect x="30" y="0" width="120" height="32" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="90" y="20" font-family="'Vazirmatn', Tahoma, sans-serif" font-size="11" fill="#475569" text-anchor="middle">کودک و نوجوان</text>
  </g>

  <!-- Shelf 1: Book Row -->
  <text x="760" y="350" font-family="'Vazirmatn', Tahoma, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="end">پیشنهادهای ویژه طاقچه</text>
  <text x="40" y="350" font-family="'Vazirmatn', Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#00aa88" text-anchor="start">مشاهده همه ←</text>

  <!-- 4 Book Cards Preview -->
  <g transform="translate(20, 365)">
    <!-- Card 1 -->
    <rect x="580" y="0" width="160" height="115" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="680" y="10" width="50" height="70" rx="4" fill="#0f766e"/>
    <rect x="595" y="15" width="75" height="10" rx="3" fill="#cbd5e1"/>
    <rect x="620" y="32" width="50" height="8" rx="3" fill="#e2e8f0"/>
    <rect x="595" y="85" width="60" height="12" rx="4" fill="#00aa88" fill-opacity="0.2"/>

    <!-- Card 2 -->
    <rect x="390" y="0" width="160" height="115" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="490" y="10" width="50" height="70" rx="4" fill="#1e3a8a"/>
    <rect x="405" y="15" width="75" height="10" rx="3" fill="#cbd5e1"/>
    <rect x="430" y="32" width="50" height="8" rx="3" fill="#e2e8f0"/>
    <rect x="405" y="85" width="60" height="12" rx="4" fill="#10b981" fill-opacity="0.2"/>

    <!-- Card 3 -->
    <rect x="200" y="0" width="160" height="115" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="300" y="10" width="50" height="70" rx="4" fill="#7c2d12"/>
    <rect x="215" y="15" width="75" height="10" rx="3" fill="#cbd5e1"/>
    <rect x="240" y="32" width="50" height="8" rx="3" fill="#e2e8f0"/>
    <rect x="215" y="85" width="60" height="12" rx="4" fill="#00aa88" fill-opacity="0.2"/>

    <!-- Card 4 -->
    <rect x="10" y="0" width="160" height="115" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="110" y="10" width="50" height="70" rx="4" fill="#4c1d95"/>
    <rect x="25" y="15" width="75" height="10" rx="3" fill="#cbd5e1"/>
    <rect x="50" y="32" width="50" height="8" rx="3" fill="#e2e8f0"/>
    <rect x="25" y="85" width="60" height="12" rx="4" fill="#10b981" fill-opacity="0.2"/>
  </g>
</svg>
