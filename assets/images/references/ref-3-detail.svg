<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <filter id="shadow3" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Browser Window Frame -->
  <rect x="0" y="0" width="800" height="500" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  
  <!-- Browser Header Bar -->
  <rect x="0" y="0" width="800" height="40" rx="10" fill="#e2e8f0"/>
  <circle cx="25" cy="20" r="6" fill="#ef4444"/>
  <circle cx="45" cy="20" r="6" fill="#f59e0b"/>
  <circle cx="65" cy="20" r="6" fill="#10b981"/>
  <rect x="150" y="8" width="500" height="24" rx="12" fill="#ffffff"/>
  <text x="400" y="24" font-family="'Vazirmatn', Tahoma, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">https://taaghche.com/book/1 (مرجع ۳: جزییات کتاب و معرفی اثر)</text>

  <!-- Book Details Main Section -->
  <rect x="20" y="55" width="760" height="280" rx="12" fill="#ffffff" filter="url(#shadow3)"/>
  
  <!-- Book Cover with 3D Spine (Right Side in RTL) -->
  <g transform="translate(560, 75)">
    <rect x="0" y="0" width="160" height="235" rx="8" fill="#0f766e" filter="url(#shadow3)"/>
    <text x="80" y="50" font-family="'Vazirmatn', Tahoma, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">شاهنامه فردوسی</text>
    <text x="80" y="75" font-family="'Vazirmatn', Tahoma, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">ابوالقاسم فردوسی</text>
    <rect x="145" y="0" width="15" height="235" rx="0" fill="#000000" fill-opacity="0.25"/>
  </g>

  <!-- Meta Info & Synopsis (Left Side) -->
  <g transform="translate(40, 75)">
    <text x="490" y="25" font-family="'Vazirmatn', Tahoma, sans-serif" font-size="20" font-weight="900" fill="#0f172a" text-anchor="end">شاهنامه فردوسی (نسخه کامل پنج جلدی)</text>
    <text x="490" y="50" font-family="'Vazirmatn', Tahoma, sans-serif" font-size="13" fill="#64748b" text-anchor="end">نویسنده: حکیم ابوالقاسم فردوسی طوسی | دسته‌بندی: شعر و ادبیات کهن</text>
    <text x="490" y="75" font-family="'Vazirmatn', Tahoma, sans-serif" font-size="12" fill="#059669" text-anchor="end">★ امتیاز ۴.۹ از ۵ (بر اساس ۴۵۰ نظر)</text>

    <!-- Description Paragraph -->
    <rect x="0" y="90" width="490" height="75" rx="6" fill="#f8fafc"/>
    <text x="475" y="112" font-family="'Vazirmatn', Tahoma, sans-serif" font-size="11" fill="#334155" text-anchor="end">شاهنامه، بزرگ‌ترین و نام‌دارترین سروده فارسی و از بزرگ‌ترین حماسه‌های جهان است. فردوسی</text>
    <text x="475" y="130" font-family="'Vazirmatn', Tahoma, sans-serif" font-size="11" fill="#334155" text-anchor="end">سی سال از عمر خود را بر سر سرایش آن نهاد و زبان و هویت ایرانی را برای همیشه جاودانه ساخت...</text>

    <!-- CTAs: Read Sample, Buy, Favorite -->
    <g transform="translate(0, 185)">
      <rect x="340" y="0" width="150" height="42" rx="21" fill="#00aa88"/>
      <text x="415" y="26" font-family="'Vazirmatn', Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">دریافت رایگان کتاب</text>

      <rect x="175" y="0" width="150" height="42" rx="21" fill="#ffffff" stroke="#00aa88" stroke-width="1.5"/>
      <text x="250" y="26" font-family="'Vazirmatn', Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#00aa88" text-anchor="middle">مطالعه نمونه کتاب</text>

      <rect x="120" y="0" width="42" height="42" rx="21" fill="#f1f5f9"/>
      <text x="141" y="27" font-size="16" text-anchor="middle">♥</text>
    </g>
  </g>

  <!-- Related Books Shelf -->
  <text x="760" y="365" font-family="'Vazirmatn', Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="end">کتاب‌های مرتبط از همین دسته</text>
  <g transform="translate(20, 380)">
    <rect x="580" y="0" width="180" height="95" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="705" y="10" width="45" height="75" rx="3" fill="#4c1d95"/>
    <text x="695" y="32" font-family="'Vazirmatn', Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="end">دیوان حافظ</text>
    <text x="695" y="50" font-family="'Vazirmatn', Tahoma, sans-serif" font-size="9" fill="#64748b" text-anchor="end">شمس‌الدین محمد</text>

    <rect x="380" y="0" width="180" height="95" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="505" y="10" width="45" height="75" rx="3" fill="#991b1b"/>
    <text x="495" y="32" font-family="'Vazirmatn', Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="end">گلستان سعدی</text>
    <text x="495" y="50" font-family="'Vazirmatn', Tahoma, sans-serif" font-size="9" fill="#64748b" text-anchor="end">مصلح‌الدین سعدی</text>

    <rect x="180" y="0" width="180" height="95" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="305" y="10" width="45" height="75" rx="3" fill="#854d0e"/>
    <text x="295" y="32" font-family="'Vazirmatn', Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="end">مثنوی معنوی</text>
    <text x="295" y="50" font-family="'Vazirmatn', Tahoma, sans-serif" font-size="9" fill="#64748b" text-anchor="end">مولانا جلال‌الدین</text>
  </g>
</svg>
