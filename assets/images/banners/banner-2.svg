<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-banner-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
    <radialGradient id="glow-2" cx="85%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="400" rx="20" fill="url(#bg-banner-2)" />
  <rect width="1200" height="400" rx="20" fill="url(#glow-2)" />

  <!-- Decorative circles / graphical elements on the left -->
  <g transform="translate(220, 200)" opacity="0.35">
    <circle cx="0" cy="0" r="140" fill="none" stroke="#60a5fa" stroke-width="2" />
    <circle cx="0" cy="0" r="100" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="6 6" />
    <circle cx="0" cy="0" r="60" fill="#60a5fa" fill-opacity="0.1" />
  </g>

  <!-- Text Content Area (RTL: on the right side) -->
  <g transform="translate(1120, 70)" direction="rtl">
    <!-- Badge -->
    <rect x="-190" y="0" width="190" height="34" rx="17" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-width="1" stroke-opacity="0.3"/>
    <text x="-95" y="22" font-family="'Vazirmatn', Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle" direction="rtl">
      ★ ۱۰۰٪ رایگان و دائمی
    </text>

    <!-- Main Title -->
    <text x="0" y="90" font-family="'Vazirmatn', Tahoma, sans-serif" font-size="36" font-weight="900" fill="#ffffff" text-anchor="start" direction="rtl">
      کتاب‌های کاملاً رایگان طاقچه برای همه
    </text>

    <!-- Subtitle -->
    <text x="0" y="145" font-family="'Vazirmatn', Tahoma, sans-serif" font-size="18" fill="#e2e8f0" text-anchor="start" opacity="0.9" direction="rtl">
      مطالعه فوری بدون نیاز به پرداخت؛ همین حالا کتابخانه شخصی خود را بسازید
    </text>

    <!-- Button Pill -->
    <g transform="translate(0, 195)">
      <rect x="-210" y="0" width="210" height="52" rx="26" fill="#ffffff" />
      <text x="-105" y="32" font-family="'Vazirmatn', Tahoma, sans-serif" font-size="16" font-weight="900" fill="#1e3a8a" text-anchor="middle" direction="rtl">
        دریافت کتاب‌های رایگان ←
      </text>
    </g>
  </g>
</svg>